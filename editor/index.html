<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABE Editor</title>
<link rel="stylesheet" href="/editor/studio.css">
</head>
<body>
<header id="toolbar">
  <strong id="project-name">ABE Studio</strong>
  <span id="doc-name" data-i18n="noDocument">No document</span><button id="download-draft" hidden data-i18n="downloadDraft">Download draft</button>
  <span class="sep"></span>
  <button id="save" data-i18n="save" data-i18n-title="saveTip">Save</button>
  <button id="undo" data-i18n="undo">Undo</button>
  <button id="redo" data-i18n="redo">Redo</button>
  <span class="sep"></span>
  <button id="mode-move" data-i18n="move" data-i18n-title="moveTip">Move</button>
  <button id="mode-rotate" data-i18n="rotate" data-i18n-title="rotateTip">Rotate</button>
  <button id="mode-scale" data-i18n="scale" data-i18n-title="scaleTip">Scale</button>
  <button id="frame" data-i18n="frame" data-i18n-title="frameTip">Frame</button>
  <details class="frame-options">
    <summary data-i18n="frameOptions">View guides</summary>
    <div class="frame-fields">
      <label><span data-i18n="previewShape">Preview shape</span>
        <select id="frame-shape">
          <option value="free" data-i18n="availableSpace">Available space</option>
          <option value="portrait" data-i18n="portraitFrame">Portrait · 9:16</option>
          <option value="landscape" data-i18n="landscapeFrame">Landscape · 16:9</option>
          <option value="classic" data-i18n="classicFrame">Classic · 4:3</option>
        </select>
      </label>
      <label><input id="show-frame-guide" type="checkbox"> <span data-i18n="marginGuide">Margin guide</span></label>
      <label><span data-i18n="guideInset">Guide inset</span> <input id="frame-margin" type="number" value="5" min="0" max="45" step="any">%</label>
    </div>
  </details>
  <label class="view-lens"><span data-i18n="viewLens">Lens</span> <input id="viewport-fov" type="number" min="1" max="170" step="any" value="50" data-i18n-title="viewLensTip">°</label>
  <span class="sep"></span>
  <label class="time"><span data-i18n="time">Time</span> <input id="time" type="range" min="0" max="24" step="0.1" value="17.5"> <span id="time-label">17.5 h</span></label>
  <button id="recook" data-i18n="refresh" data-i18n-title="refreshTip">Refresh</button>
  <button id="simulate" data-i18n="simulate" data-i18n-title="simulateTip">Simulate</button>
  <span class="grow"></span>
  <select id="project-tools" aria-label="Project tools" hidden><option value="" data-i18n="projectTools">Project tools</option></select>
  <span id="fps"></span>
  <span id="project-tab-tools"></span>
  <button id="language" class="mini" data-i18n="language">한국어</button>
  <span id="connection" data-i18n="connecting">connecting</span>
</header>
<main>
  <section id="left">
    <div class="panel" id="assets">
      <h2><span data-i18n="assets">Assets</span><span><button id="rescan-assets" class="mini" data-i18n="rescanAssets" data-i18n-title="rescanAssetsTip">Rescan</button><button id="new-scene" class="mini" data-i18n="newScene" data-i18n-title="newSceneTip">+ Scene</button><button id="new-look" class="mini" data-i18n="newLook" data-i18n-title="newLookFile">+ Look</button></span></h2>
      <div id="asset-scan-report" aria-live="polite"></div>
      <div id="assets-list"></div>
    </div>
    <div class="panel" id="outliner">
      <h2><span data-i18n="outliner">Outliner</span>
        <span>
          <button id="bookmark-camera" class="mini" data-i18n="bookmarkCamera" data-i18n-title="bookmarkCameraTip">+ Camera</button>
          <button id="add-entity" class="mini" data-i18n-title="addEntityTip">+</button>
          <button id="duplicate-entity" class="mini" data-i18n-title="duplicateTip">⧉</button>
          <button id="delete-entity" class="mini" data-i18n-title="deleteTip">✕</button>
        </span>
      </h2>
      <input id="outliner-filter" type="search" data-i18n-placeholder="filter" placeholder="Filter">
      <div id="outliner-tree" tabindex="0"></div>
    </div>
  </section>
  <div id="preview-frame"><section id="viewport" tabindex="0">
    <canvas id="overlay"></canvas>
    <div id="frame-guide" hidden aria-hidden="true"></div>
  </section></div>
  <section id="right" class="panel">
    <h2 data-i18n="inspector">Inspector</h2>
    <div id="inspector-body" tabindex="-1"></div>
  </section>
</main>
<footer class="panel" id="console">
  <h2 data-i18n="console">Console</h2>
  <div id="console-lines"></div>
</footer>
<script type="module" src="/editor/studio.js"></script>
<dialog id="project-tool-panel" aria-labelledby="project-tool-title">
  <header><strong id="project-tool-title"></strong>
    <a id="project-tool-external" target="_blank" rel="noopener noreferrer" data-i18n="openSeparately">Open separately</a>
    <button type="button" id="project-tool-close" data-i18n="backToScene">Back to scene</button>
  </header>
  <iframe id="project-tool-frame" referrerpolicy="no-referrer" sandbox="allow-forms allow-scripts allow-same-origin allow-downloads allow-popups"></iframe>
</dialog>
</body>
</html>
