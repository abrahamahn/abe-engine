[package]
name = "abe-web"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "ABE's browser player: the stylized renderer in a canvas through WebGPU"

[lib]
# The module web/abe.js loads. Native builds compile to an empty library.
crate-type = ["cdylib"]

[dependencies]
abe-engine = { path = "../.." }
abe-physics = { path = "../abe-physics" }
