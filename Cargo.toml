[package]
name = "abe-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "ABE studio's native 3D renderer"

[workspace]
members = ["crates/abe-core", "crates/abe-assets", "crates/abe-shader"]
resolver = "3"

[dependencies]
abe-core = { path = "crates/abe-core" }
abe-assets = { path = "crates/abe-assets" }
abe-shader = { path = "crates/abe-shader" }
