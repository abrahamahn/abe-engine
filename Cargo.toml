[package]
name = "ganbate-engine"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
publish = false
description = "Ganbate Studio's native 3D renderer"

[workspace]
members = ["crates/ganbate-agent", "crates/ganbate-core", "crates/ganbate-assets", "crates/ganbate-audio",
    "crates/ganbate-seq",
    "crates/ganbate-vfx", "crates/ganbate-physics", "crates/ganbate-pipeline", "crates/ganbate-scene", "crates/ganbate-shader", "crates/ganbate-studio", "crates/ganbate-web"]
resolver = "3"

[dependencies]
ganbate-core = { path = "crates/ganbate-core" }
ganbate-assets = { path = "crates/ganbate-assets" }
ganbate-pipeline = { path = "crates/ganbate-pipeline" }
ganbate-scene = { path = "crates/ganbate-scene" }
ganbate-shader = { path = "crates/ganbate-shader" }
ganbate-physics = { path = "crates/ganbate-physics" }
