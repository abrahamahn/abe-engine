<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>ABE Web Player</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #07090f;
    --panel: rgba(10, 13, 22, 0.78);
    --line: rgba(255, 255, 255, 0.12);
    --text: #e8ecf4;
    --dim: #9aa3b5;
    --accent: #f2a65a;
    --bad: #ff7a7a;
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; outline: none; }
  canvas.fixed { inset: auto; left: 0; top: 0; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #hud { top: max(12px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); padding: 8px 12px; max-width: min(560px, calc(100vw - 24px)); }
  #hud b { color: var(--accent); font-weight: 600; letter-spacing: 0.04em; }
  #status { color: var(--text); font-variant-numeric: tabular-nums; }
  #adapter { color: var(--dim); font-size: 12px; }
  #help { display: none; color: var(--dim); font-size: 12px; margin-top: 6px; }
  #hud.open #help { display: block; }
  #hud button.small { float: right; margin: -2px -6px 0 10px; }
  #loading { top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 18px 22px; width: min(360px, calc(100vw - 48px)); }
  #phase { margin-bottom: 10px; }
  .bar { height: 6px; background: rgba(255, 255, 255, 0.08); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); transition: width 0.15s; }
  #errors { display: none; bottom: max(12px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    width: min(720px, calc(100vw - 24px)); max-height: 40vh; overflow: auto; padding: 10px 14px; border-color: rgba(255, 122, 122, 0.5); }
  #errors h2 { margin: 0 0 6px; font-size: 13px; color: var(--bad); }
  #errors pre { margin: 0; white-space: pre-wrap; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #ffd0d0; }
  #touch { display: none; bottom: max(10px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    padding: 8px; gap: 6px; flex-wrap: wrap; justify-content: center; width: max-content; max-width: calc(100vw - 20px); }
  body.touch #touch { display: flex; }
  button { font: inherit; color: var(--text); background: rgba(255, 255, 255, 0.08); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; min-width: 44px; min-height: 40px; touch-action: none; user-select: none; -webkit-user-select: none; }
  button:active, button.on { background: rgba(242, 166, 90, 0.3); border-color: var(--accent); }
  button.small { min-height: 0; min-width: 0; padding: 2px 8px; font-size: 12px; }
  .sep { width: 1px; background: var(--line); margin: 2px 2px; }
  noscript { position: fixed; inset: 0; display: grid; place-items: center; }
</style>
</head>
<body>
<canvas id="view" tabindex="0" aria-label="ABE render view"></canvas>
<div id="hud" class="panel">
  <button class="small" id="help-toggle" aria-expanded="false">?</button>
  <div><b>ABE</b> <span id="status">starting…</span></div>
  <div id="adapter"></div>
  <div id="help">W A S D fly · Q / E down / up · arrows or drag to look · Shift faster · 1–9 views ·
    T / G time · C day cycle · Y weather · P pause motion.<br>
    Touch: drag with one finger to look, with two to move; the buttons below change time,
    weather and views.</div>
</div>
<div id="loading" class="panel">
  <div id="phase">Loading…</div>
  <div class="bar"><div id="progress"></div></div>
</div>
<div id="errors" class="panel"><h2>Errors</h2><pre id="error-list"></pre></div>
<div id="touch" class="panel" aria-label="Controls"></div>
<noscript>The ABE web player needs JavaScript and WebGPU or WebGL 2.</noscript>
<script type="module">
import { startPlayer, startSelfTest } from './abe.js';

const params = new URLSearchParams(location.search);
const $ = (id) => document.getElementById(id);
const canvas = $('view');
const phase = $('phase');
const progress = $('progress');
const errorList = $('error-list');
const shown = [];
const showError = (text) => {
  console.error(text);
  if (shown.includes(text) || shown.length > 50) return;
  shown.push(text);
  $('errors').style.display = 'block';
  errorList.textContent = shown.join('\n');
};
window.addEventListener('error', (e) => showError(e.message));
window.addEventListener('unhandledrejection', (e) => showError(String(e.reason && e.reason.message || e.reason)));

// Canvas size: CSS size times the device pixel ratio (capped by ?dpr=; default 2, or 1.5 on
// touch devices, where full-resolution post-processing is costly) times ?scale=; ?size=WxH
// fixes the drawing buffer instead.
const coarse = matchMedia('(pointer: coarse)').matches;
const maxDpr = Number(params.get('dpr')) || (coarse ? 1.5 : 2);
const scale = Math.min(Math.max(Number(params.get('scale')) || 1, 0.25), 2);
const fixed = /^(\d+)x(\d+)$/.exec(params.get('size') || '');
if (fixed) {
  canvas.classList.add('fixed');
  canvas.style.width = `${fixed[1] / devicePixelRatio}px`;
  canvas.style.height = `${fixed[2] / devicePixelRatio}px`;
}
const sizeCanvas = () => {
  let w; let h;
  if (fixed) {
    w = Number(fixed[1]); h = Number(fixed[2]);
  } else {
    const dpr = Math.min(window.devicePixelRatio || 1, maxDpr) * scale;
    w = Math.max(1, Math.round(canvas.clientWidth * dpr));
    h = Math.max(1, Math.round(canvas.clientHeight * dpr));
  }
  if (canvas.width !== w) canvas.width = w;
  if (canvas.height !== h) canvas.height = h;
};
sizeCanvas();

$('help-toggle').addEventListener('click', () => {
  const open = $('hud').classList.toggle('open');
  $('help-toggle').setAttribute('aria-expanded', String(open));
});
if (coarse || params.get('touch') === '1') document.body.classList.add('touch');
window.addEventListener('keydown', (e) => {
  if (e.code === 'KeyH' && !e.repeat) $('help-toggle').click();
});

const scene = params.get('scene');
if (params.get('selftest') === '1') {
  // GPU-layer self-test (compute, copies, mips, canvas blit); see crates/abe-web/src/selftest.rs.
  try {
    const result = await startSelfTest({
      canvas, wasm: params.get('wasm') || './abe_web.wasm', sizeCanvas, api: params.get('api') || 'auto',
      onPhase(text) { phase.textContent = text; },
      onLog(level, text) { (level >= 2 ? console.error : console.log)(text); if (level >= 2) showError(text); },
      onError: showError,
    });
    $('loading').style.display = 'none';
    $('status').textContent = `self-test done, ${result.errors().length} errors`;
    $('adapter').textContent = `${result.adapter} · ${result.format}`;
    window.abe = { selftest: result };
  } catch (e) {
    $('loading').style.display = 'none';
    showError(e.message || String(e));
    window.abe = { failed: e.message || String(e) };
  }
} else if (!scene) {
  showError('Give the world to show: index.html?scene=world.abew&look=look.json');
  phase.textContent = 'No scene';
} else {
  try {
    const player = await startPlayer({
      canvas,
      wasm: params.get('wasm') || './abe_web.wasm',
      api: params.get('api') || 'auto',
      scene,
      look: params.get('look') || '',
      query: location.search,
      sizeCanvas,
      onPhase(text, p) {
        $('loading').style.display = text ? 'block' : 'none';
        phase.textContent = text;
        progress.style.width = `${Math.round(Math.max(0, Math.min(1, p)) * 100)}%`;
      },
      onLog(level, text) {
        (level >= 2 ? console.error : level === 1 ? console.warn : console.log)(text);
        if (level >= 2) showError(text);
      },
      onStatus(text) { $('status').textContent = text; },
      onError: showError,
    });
    $('adapter').textContent = `${player.adapter} · ${player.format}`;
    window.abe = player;
    buildTouchControls(player);
    canvas.focus();
  } catch (e) {
    $('loading').style.display = 'none';
    showError(e.message || String(e));
    window.abe = { failed: e.message || String(e) };
  }
}

function buildTouchControls(player) {
  const bar = $('touch');
  const code = (c) => c.charCodeAt(0);
  const hold = (label, key, title) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.title = title;
    const up = () => { b.classList.remove('on'); player.key(key, false); };
    b.addEventListener('pointerdown', (e) => { e.preventDefault(); b.classList.add('on'); player.key(key, true); });
    b.addEventListener('pointerup', up);
    b.addEventListener('pointercancel', up);
    b.addEventListener('pointerleave', up);
    bar.append(b);
  };
  const tap = (label, key, title) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.title = title;
    b.addEventListener('click', () => { player.key(key, true); player.key(key, false); });
    bar.append(b);
  };
  const sep = () => { const s = document.createElement('div'); s.className = 'sep'; bar.append(s); };
  hold('◀ time', code('g'), 'Earlier (G)');
  hold('time ▶', code('t'), 'Later (T)');
  tap('cycle', code('c'), 'Day cycle (C)');
  tap('weather', code('y'), 'Next weather (Y)');
  tap('pause', code('p'), 'Pause motion (P)');
  sep();
  hold('▲', code('e'), 'Up (E)');
  hold('▼', code('q'), 'Down (Q)');
  if (player.views.length) sep();
  player.views.slice(0, 9).forEach((name, i) => tap(`${i + 1} ${name}`, code(String(i + 1)), `View ${i + 1}`));
}
</script>
</body>
</html>
